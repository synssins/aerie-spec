components:
  securitySchemes:
    cookieAuth:
      type: "apiKey"
      in: "cookie"
      name: "__Host-kb"
    bearerAuth:
      type: "http"
      scheme: "bearer"
      description: "An API token (kbt_...). Open to the routes marked x-kb-api-token read or write only."
  schemas:
    AcceptPage:
      type: "object"
      properties:
        title:
          type: "string"
        contentJson:
          type: "string"
        tags:
          type: "array"
          items:
            type: "string"
          nullable: true
    AcceptRequest:
      type: "object"
      properties:
        pages:
          type: "array"
          items:
            "$ref": "#/components/schemas/AcceptPage"
          nullable: true
        spaceId:
          type: "string"
          format: "uuid"
          nullable: true
        parentId:
          type: "string"
          format: "uuid"
          nullable: true
        updatePageId:
          type: "string"
          format: "uuid"
          nullable: true
        details:
          nullable: true
          allOf:
            - "$ref": "#/components/schemas/PageDetailsRequest"
        attachOriginals:
          type: "boolean"
        newFolder:
          type: "string"
          nullable: true
    AccessRequestBody:
      type: "object"
      properties:
        role:
          "$ref": "#/components/schemas/SpaceRole"
        reason:
          type: "string"
          nullable: true
    AccessRequestedDto:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
    AdminUserDto:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        userName:
          type: "string"
        displayName:
          type: "string"
        source:
          type: "string"
        isAdmin:
          type: "boolean"
