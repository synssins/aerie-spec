        '404': {$ref: '#/components/responses/NotFound'}
components:
  securitySchemes:
    basic:
      type: http
      scheme: basic
      description: Username and password. Other schemes are specified in behaviour/identity.md.
  parameters:
    contentId:
      name: id
      in: path
      required: true
      description: Content id, decimal digits.
      schema: {type: string, pattern: '^[0-9]+$'}
    attachmentId:
      name: attachmentId
      in: path
      required: true
      description: Id of the attachment, decimal digits. The `att` prefix some clients add is accepted.
      schema: {type: string, pattern: '^(att)?[0-9]+$'}
    versionPath:
      name: version
      in: path
      required: true
      description: A version number.
      schema: {type: integer, format: int32, minimum: 1}
    contentTypePath:
      name: type
      in: path
      required: true
      description: Content type to list.
      schema:
        type: string
        enum: [page, blogpost, comment, attachment]
    spaceKeyPath:
      name: spaceKey
      in: path
      required: true
      description: Space key, matched without regard to case.
      schema: {type: string}
    spaceKeyQuery:
      name: spaceKey
      in: query
      description: Only content in this space.
      schema: {type: string}
    expand:
      name: expand
      in: query
      description: Comma-separated field paths to expand, with dots for nested fields. See behaviour/common.md.
      schema: {type: string}
      example: body.storage,version,ancestors
    start:
      name: start
      in: query
      description: Zero-based index of the first item to return.
      schema: {type: integer, format: int32, minimum: 0, default: 0}
    limit25:
      name: limit
      in: query
      description: Most items to return, capped by the server ceiling.
      schema: {type: integer, format: int32, minimum: 1, default: 25}
    limit50:
      name: limit
      in: query
      description: Most items to return, capped by the server ceiling.
      schema: {type: integer, format: int32, minimum: 1, default: 50}
    limit100:
      name: limit
      in: query
      description: Most items to return, capped by the server ceiling.
      schema: {type: integer, format: int32, minimum: 1, default: 100}
    limit200:
      name: limit
      in: query
      description: Most items to return, capped by the server ceiling.
      schema: {type: integer, format: int32, minimum: 1, default: 200}
    cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous response. Absent on the first request.
      schema: {type: string}
    statusFilter:
      name: status
      in: query
      description: Statuses to accept. `any` means current or trashed.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          enum: [current, trashed, draft, any]
        default: [current]
    parentVersion:
      name: parentVersion
      in: query
      description: Version of the parent to read children at. Only 0 (now) is supported.
      schema: {type: integer, format: int32, default: 0}
    spaceDepth:
      name: depth
      in: query
      description: All content, or top-level content only.
      schema:
        type: string
        enum: [all, root]
        default: all
    cql:
      name: cql
      in: query
      required: true
      description: The CQL query. See behaviour/search-cql.md.
      schema: {type: string}
      example: type = page AND space = OPS AND label = release ORDER BY lastmodified DESC
    cqlcontext:
      name: cqlcontext
      in: query
      description: 'JSON object with `spaceKey` and `contentId`, used by context functions such as currentSpace().'
      schema: {type: string}
      example: '{"spaceKey":"OPS"}'
    userKeyQuery:
      name: key
      in: query
      description: User key. Give this or `username`, not both.
      schema: {type: string}
    usernameQuery:
      name: username
      in: query
      description: Username. Give this or `key`, not both.
      schema: {type: string}
    xoauthRequestorId:
      name: xoauth_requestor_id
      in: query
      description: Accepted and ignored. Since 10.0.1.
      schema: {type: string}
    xsrfToken:
      name: X-Atlassian-Token
      in: header
      required: true
      description: Required on multipart writes. Both spellings are accepted.
      schema:
        type: string
        enum: [no-check, nocheck]
  responses:
    BadRequest:
      description: A parameter or the body is not valid.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RestError'}
    Unauthorized:
      description: No valid credentials, and anonymous access is not allowed for this.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RestError'}
    Forbidden:
      description: The caller may see the target but not do this to it, or the XSRF header is missing.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RestError'}
    NotFound:
      description: The target does not exist, or the caller may not see it.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RestError'}
    Conflict:
      description: The request clashes with the current state, for example a stale version number.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RestError'}
    TooLarge:
