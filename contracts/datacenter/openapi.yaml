openapi: 3.0.3
info:
  title: Aerie Data Center compatible API
  version: 0.1.0
  description: >-
    The Data Center compatible REST surface of aerie, tier T1. One contract
    covers Data Center 9.0 and later; `x-aerie-since` on each operation names
    the first Data Center version whose published spec has it. Behaviour is
    specified in `behaviour/` (start with `behaviour/common.md`). Every
    description and example here is written by the aerie spec room.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: '{base}'
    description: The aerie site, with any context prefix.
    variables:
      base:
        default: http://localhost:8080
security:
  - basic: []
  - {}
tags:
  - name: content
    description: Pages, blog posts and comments.
  - name: child-content
    description: Children and descendants of a piece of content.
  - name: attachments
    description: Files attached to content, and their versions.
  - name: labels
    description: Labels on content.
  - name: versions
    description: Version history of content.
  - name: body-conversion
    description: Converting bodies between representations.
  - name: spaces
    description: Spaces, their content and trash.
  - name: search
    description: CQL search.
  - name: users
    description: Reading users and their groups.
  - name: server-information
    description: Facts about the running build.
  - name: long-tasks
    description: Work that outlives a request.
paths:
  /rest/api/content:
    get:
      tags: [content]
      operationId: listContent
      summary: List pages or blog posts
      description: Offset-paged list of content filtered by type, space, title, status, posting day or ids. See behaviour/content.md.
      x-aerie-sources: [L-0001, L-0003, L-0004, L-0007, L-0013, L-0014]
      x-aerie-since: 9.0.1
      x-aerie-tier: T1
      parameters:
        - $ref: '#/components/parameters/spaceKeyQuery'
        - $ref: '#/components/parameters/xoauthRequestorId'
        - $ref: '#/components/parameters/expand'
        - $ref: '#/components/parameters/limit25'
        - $ref: '#/components/parameters/start'
        - name: postingDay
          in: query
          description: Blog posts only. The day the post is dated, as yyyy-mm-dd.
          schema: {type: string, format: date}
        - name: ids
          in: query
          description: Fetch exactly these content ids. When present, `type` is not applied. Since 9.5.1.
          style: form
          explode: true
          schema:
            type: array
            items: {type: string}
        - name: title
          in: query
          description: Exact title, matched without regard to case.
          schema: {type: string}
        - name: type
          in: query
          description: Content type to list.
          schema:
            type: string
            enum: [page, blogpost]
            default: page
        - $ref: '#/components/parameters/statusFilter'
      responses:
        '200':
          description: One page of content.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContentPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [content]
      operationId: createContent
      summary: Create a page, blog post or comment
      description: Creates content, or publishes a draft when the body names an existing draft id. See behaviour/content.md.
      x-aerie-sources: [L-0001, L-0007, L-0015]
      x-aerie-since: 9.0.1
      x-aerie-tier: T1
      parameters:
        - $ref: '#/components/parameters/expand'
        - name: status
          in: query
          description: Status to create the content in. Wins over `status` in the body.
          schema:
            type: string
            enum: [current, draft]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ContentWrite'}
            example:
              type: page
              title: Release checklist
              space: {key: OPS}
              ancestors: [{id: '40001'}]
              body:
                storage:
                  value: <p>Steps before every release.</p>
                  representation: storage
      responses:
        '200':
          description: The created content.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Content'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /rest/api/content/search:
    get:
      tags: [search]
      operationId: searchContent
      summary: Find content with CQL
      description: Returns content matching a CQL query, offset-paged. See behaviour/search-cql.md.
      x-aerie-sources: [L-0001, L-0004, L-0007, L-0016, L-0017, L-0018, L-0019]
      x-aerie-since: 9.0.1
      x-aerie-tier: T1
      parameters:
        - $ref: '#/components/parameters/cql'
        - $ref: '#/components/parameters/cqlcontext'
        - $ref: '#/components/parameters/xoauthRequestorId'
        - $ref: '#/components/parameters/expand'
        - $ref: '#/components/parameters/limit25'
        - $ref: '#/components/parameters/start'
      responses:
        '200':
          description: One page of matching content.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContentPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /rest/api/content/scan:
    get:
      tags: [content]
      operationId: scanContent
      summary: Walk all content with a cursor
      description: Cursor-paged walk over every item the caller can see. See behaviour/content.md and behaviour/common.md.
      x-aerie-sources: [L-0001, L-0003, L-0007, L-0015]
      x-aerie-since: 9.0.1
      x-aerie-tier: T1
      parameters:
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/spaceKeyQuery'
        - $ref: '#/components/parameters/expand'
        - $ref: '#/components/parameters/limit25'
        - name: type
          in: query
          description: Content type to walk. Read on the first request only. Since 9.5.1.
          schema:
            type: string
            enum: [page, blogpost, comment]
            default: page
        - $ref: '#/components/parameters/statusFilter'
      responses:
        '200':
          description: One cursor page of content.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContentCursorPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /rest/api/content/{id}:
    parameters:
      - $ref: '#/components/parameters/contentId'
    get:
      tags: [content]
      operationId: getContent
      summary: Read one piece of content
      description: Default expansion is space, history and version. `version` reads a historical version. See behaviour/content.md.
      x-aerie-sources: [L-0001, L-0004, L-0007, L-0014, L-0015]
      x-aerie-since: 9.0.1
      x-aerie-tier: T1
      parameters:
        - $ref: '#/components/parameters/xoauthRequestorId'
        - $ref: '#/components/parameters/expand'
        - name: version
          in: query
          description: Return this version number instead of the current one.
          schema: {type: integer, format: int32, minimum: 1}
        - $ref: '#/components/parameters/statusFilter'
      responses:
        '200':
          description: The content.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Content'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [content]
      operationId: deleteContent
      summary: Trash or purge content
      description: Trashes current content; purges trashed content when `status=trashed`; deletes comments and drafts outright. See behaviour/content.md.
      x-aerie-sources: [L-0001, L-0007, L-0015]
      x-aerie-since: 9.0.1
      x-aerie-tier: T1
      parameters:
        - name: status
          in: query
          description: The status the content has now.
          schema:
            type: string
            enum: [current, trashed, draft]
            default: current
      responses:
        '204': {description: Trashed or deleted.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    put:
      tags: [content]
      operationId: updateContent
      summary: Update content
      description: >-
        Requires `version.number` equal to the current number plus one. Also
        restores trashed content (query `status=trashed`, body `status:
        current`). The published spec names the path parameter `contentId`; the URL is the same. See behaviour/content.md.
      x-aerie-sources: [L-0001, L-0002, L-0007, L-0015]
      x-aerie-since: 9.0.1
      x-aerie-tier: T1
      parameters:
        - name: status
          in: query
          description: The status the content has now.
          schema:
            type: string
            enum: [current, trashed, draft]
            default: current
        - name: conflictPolicy
          in: query
          description: What to do when the version number does not follow the current one. Only `abort` is supported.
          schema:
            type: string
            enum: [abort]
            default: abort
        - name: asyncReconciliation
          in: query
          description: Accepted and ignored. Since 9.2.4.
          schema: {type: boolean, default: false}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ContentWrite'}
            example:
              type: page
              title: Release checklist
              version: {number: 2, message: Added rollback step}
              body:
                storage:
                  value: <p>Steps before every release.</p><ol><li>Plan rollback</li></ol>
                  representation: storage
      responses:
        '200':
          description: The updated content.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Content'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /rest/api/content/{id}/history:
    get:
      tags: [versions]
      operationId: getContentHistory
      summary: Read the history of content
      description: Creation facts and links to versions. See behaviour/content.md.
      x-aerie-sources: [L-0001, L-0007, L-0014]
      x-aerie-since: 9.0.1
      x-aerie-tier: T1
      parameters:
        - $ref: '#/components/parameters/contentId'
        - $ref: '#/components/parameters/expand'
      responses:
        '200':
          description: The history.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/History'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /rest/api/content/{id}/history/{version}/macro/hash/{hash}:
    get:
      tags: [content]
      operationId: getMacroBodyByHash
      summary: Read a macro by hash
      description: Looks up a macro in one version of the body by aerie's hash of its markup. See behaviour/content.md.
      x-aerie-sources: [L-0001, L-0007]
      x-aerie-since: 9.0.1
      x-aerie-tier: T1
      parameters:
        - $ref: '#/components/parameters/contentId'
        - $ref: '#/components/parameters/versionPath'
        - name: hash
          in: path
          required: true
          description: Lower-case hex SHA-256 of the macro's storage markup.
          schema: {type: string}
      responses:
        '200':
          description: The macro.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MacroInstance'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /rest/api/content/{id}/history/{version}/macro/id/{macroId}:
    get:
      tags: [content]
      operationId: getMacroBodyById
      summary: Read a macro by id
      description: Looks up the macro with this macro id in one version of the body. See behaviour/content.md.
      x-aerie-sources: [L-0001, L-0007]
      x-aerie-since: 9.0.1
      x-aerie-tier: T1
      parameters:
        - $ref: '#/components/parameters/contentId'
        - $ref: '#/components/parameters/versionPath'
        - name: macroId
          in: path
          required: true
          description: The macro id stored with the macro.
          schema: {type: string}
      responses:
        '200':
          description: The macro.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MacroInstance'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /rest/api/content/{id}/version/{versionNumber}:
    delete:
      tags: [versions]
      operationId: deleteContentVersion
      summary: Remove one historical version
      description: Pages and blog posts only; the current version cannot be removed. See behaviour/content.md.
      x-aerie-sources: [L-0001, L-0007]
      x-aerie-since: 9.0.1
      x-aerie-tier: T1
      parameters:
        - $ref: '#/components/parameters/contentId'
        - name: versionNumber
          in: path
          required: true
          description: The version to remove.
          schema: {type: integer, format: int32, minimum: 1}
      responses:
        '204': {description: Removed.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /rest/api/content/{id}/child:
    get:
      tags: [child-content]
      operationId: getChildren
      summary: Direct children by type
      description: A map keyed by content type; pick types with `expand` (page, comment, attachment). See behaviour/content.md.
      x-aerie-sources: [L-0001, L-0007, L-0014]
      x-aerie-since: 9.0.1
      x-aerie-tier: T1
      parameters:
        - $ref: '#/components/parameters/contentId'
        - $ref: '#/components/parameters/expand'
        - $ref: '#/components/parameters/limit25'
        - $ref: '#/components/parameters/start'
        - $ref: '#/components/parameters/parentVersion'
      responses:
        '200':
          description: Children by type.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContentByType'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /rest/api/content/{id}/child/comment:
    get:
      tags: [child-content]
      operationId: getChildComments
      summary: Comments on content
      description: Top-level comments, or the whole thread with `depth=all`, filtered by location. See behaviour/content.md.
      x-aerie-sources: [L-0001, L-0007]
      x-aerie-since: 9.0.1
      x-aerie-tier: T1
      parameters:
        - $ref: '#/components/parameters/contentId'
        - $ref: '#/components/parameters/expand'
        - name: depth
          in: query
          description: Empty for top-level comments only, `all` for every comment in the thread.
          schema:
            type: string
            enum: ['', all]
            default: ''
        - $ref: '#/components/parameters/limit25'
        - $ref: '#/components/parameters/start'
        - name: location
          in: query
          description: Only comments in these locations. Empty means all.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [inline, footer, resolved]
        - $ref: '#/components/parameters/parentVersion'
      responses:
        '200':
          description: One page of comments.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContentPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /rest/api/content/{id}/child/{type}:
    get:
      tags: [child-content]
      operationId: getChildrenOfType
      summary: Direct children of one type
      description: Offset-paged list of one child type. See behaviour/content.md.
      x-aerie-sources: [L-0001, L-0007]
      x-aerie-since: 9.0.1
      x-aerie-tier: T1
      parameters:
        - $ref: '#/components/parameters/contentId'
        - $ref: '#/components/parameters/contentTypePath'
        - $ref: '#/components/parameters/expand'
        - $ref: '#/components/parameters/limit25'
        - $ref: '#/components/parameters/start'
        - $ref: '#/components/parameters/parentVersion'
      responses:
        '200':
          description: One page of children.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContentPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /rest/api/content/{id}/descendant:
    get:
      tags: [child-content]
      operationId: getDescendants
      summary: Descendants by type
      description: A map keyed by content type covering all levels; pick types with `expand`. See behaviour/content.md.
      x-aerie-sources: [L-0001, L-0007, L-0014]
      x-aerie-since: 9.0.1
      x-aerie-tier: T1
      parameters:
        - $ref: '#/components/parameters/contentId'
        - $ref: '#/components/parameters/expand'
      responses:
        '200':
          description: Descendants by type.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContentByType'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /rest/api/content/{id}/descendant/{type}:
    get:
      tags: [child-content]
      operationId: getDescendantsOfType
      summary: Descendants of one type
      description: Offset-paged list of one descendant type. See behaviour/content.md.
      x-aerie-sources: [L-0001, L-0007]
      x-aerie-since: 9.0.1
      x-aerie-tier: T1
      parameters:
        - $ref: '#/components/parameters/contentId'
        - $ref: '#/components/parameters/contentTypePath'
        - $ref: '#/components/parameters/expand'
        - $ref: '#/components/parameters/limit25'
        - $ref: '#/components/parameters/start'
      responses:
        '200':
          description: One page of descendants.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContentPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /rest/api/content/{id}/descendant/page/count:
    get:
      tags: [child-content]
      operationId: countDescendantPages
      summary: Count pages below a page
      description: Counts current pages at any depth below the page, not the page itself. See behaviour/content.md.
      x-aerie-sources: [L-0005, L-0007]
      x-aerie-since: 10.2.20
      x-aerie-tier: T1
      parameters:
        - $ref: '#/components/parameters/contentId'
      responses:
        '200':
          description: The count.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DescendantPageCount'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /rest/api/content/{id}/child/attachment:
    get:
      tags: [attachments]
      operationId: listAttachments
      summary: List attachments
      description: Current attachments of the content, offset-paged. See behaviour/attachments.md.
      x-aerie-sources: [L-0001, L-0007]
      x-aerie-since: 9.0.1
      x-aerie-tier: T1
      parameters:
        - $ref: '#/components/parameters/contentId'
        - $ref: '#/components/parameters/expand'
        - name: filename
          in: query
          description: Only the attachment with this exact file name.
          schema: {type: string}
        - name: mediaType
          in: query
          description: Only attachments of this MIME type.
          schema: {type: string}
        - $ref: '#/components/parameters/limit50'
        - $ref: '#/components/parameters/start'
      responses:
        '200':
          description: One page of attachments.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContentPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [attachments]
      operationId: createAttachments
      summary: Upload attachments
      description: Multipart upload of one or more files. Needs the XSRF header. See behaviour/attachments.md.
      x-aerie-sources: [L-0001, L-0007, L-0015]
      x-aerie-since: 9.0.1
      x-aerie-tier: T1
      parameters:
        - $ref: '#/components/parameters/contentId'
        - $ref: '#/components/parameters/expand'
        - $ref: '#/components/parameters/xsrfToken'
        - name: allowDuplicated
          in: query
          description: When true, a file whose name already exists becomes a new version of that attachment.
          schema: {type: boolean, default: false}
        - name: status
          in: query
          description: Status of the content to attach to.
          schema:
            type: string
            enum: [current, draft]
            default: current
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: '#/components/schemas/AttachmentUpload'}
            encoding:
              file:
                contentType: application/octet-stream
      responses:
        '200':
          description: The created attachments.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContentPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/TooLarge'}
  /rest/api/content/{id}/child/attachment/{attachmentId}:
    parameters:
      - $ref: '#/components/parameters/contentId'
      - $ref: '#/components/parameters/attachmentId'
    put:
      tags: [attachments]
      operationId: updateAttachment
      summary: Update attachment properties
      description: Renames, changes media type or comment, or moves to other content. Bytes do not change. See behaviour/attachments.md.
      x-aerie-sources: [L-0001, L-0007]
      x-aerie-since: 9.0.1
      x-aerie-tier: T1
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ContentWrite'}
      responses:
        '200':
          description: The attachment.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Content'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      tags: [attachments]
      operationId: deleteAttachment
      summary: Trash an attachment
      description: Moves the attachment and all its versions to the space trash. See behaviour/attachments.md.
      x-aerie-sources: [L-0001, L-0007]
      x-aerie-since: 9.0.1
      x-aerie-tier: T1
      responses:
        '204': {description: Trashed.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /rest/api/content/{id}/child/attachment/{attachmentId}/data:
    post:
      tags: [attachments]
      operationId: updateAttachmentData
      summary: Upload new bytes for an attachment
      description: Adds a new version with the uploaded file. Needs the XSRF header. See behaviour/attachments.md.
      x-aerie-sources: [L-0001, L-0007]
      x-aerie-since: 9.0.1
      x-aerie-tier: T1
      parameters:
        - $ref: '#/components/parameters/contentId'
        - $ref: '#/components/parameters/attachmentId'
        - $ref: '#/components/parameters/xsrfToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: '#/components/schemas/AttachmentDataUpload'}
      responses:
        '200':
          description: The attachment.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Content'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/TooLarge'}
